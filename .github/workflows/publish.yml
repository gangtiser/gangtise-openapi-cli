name: Publish Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify tag matches package version
        # Unconditional: a workflow_dispatch from a branch ref must not publish
        # whatever version happens to be in package.json — dispatch is only a
        # re-run escape hatch and must target a v* tag ref.
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "publish requires a v* tag ref (got $GITHUB_REF); workflow_dispatch must target a tag"
            exit 1
          fi
          node -e "const pkg = require('./package.json'); const expected = 'v' + pkg.version; if (process.env.GITHUB_REF_NAME !== expected) { console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + expected); process.exit(1) }"

      - run: npm ci

      - run: npm run prepare

      # Everything below must pass before anything is published: a tag push publishes
      # straight from here, without waiting on test.yml.
      - run: npm run typecheck

      - run: npm test

      # The tarball is the product: install it the way a user would, and check it reports
      # the version being released.
      - name: Pack & install smoke test
        run: |
          npm pack
          npm install -g ./gangtise-openapi-cli-*.tgz
          test "$(gangtise --version 2>/dev/null | head -1)" = "${GITHUB_REF_NAME#v}"
          gangtise --help > /dev/null
          test -f "$(npm root -g)/gangtise-openapi-cli/gangtise-openapi/SKILL.md"
          rm ./gangtise-openapi-cli-*.tgz

      - run: npm publish
